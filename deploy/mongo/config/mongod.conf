# MongoDB configuration for OpenIM (production-oriented)
# Adjust storage.wiredTiger.engineConfig.cacheSizeGB to ~50% of MONGO_MEMORY_LIMIT
# Example: 3072M container -> cacheSizeGB: 1.5; 4096M -> 2; 8192M -> 4

storage:
  engine: wiredTiger
  dbPath: /data/db
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1
      journalCompressor: snappy
      maxCacheOverflowFileSizeGB: 0.5
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

systemLog:
  destination: file
  path: /data/logs/mongod.log
  logAppend: true
  logRotate: reopen
  verbosity: 0
  component:
    access:
      verbosity: 0
    command:
      verbosity: 0

net:
  bindIp: 0.0.0.0
  port: 27017
  ipv6: false
  maxIncomingConnections: 2000
  compression:
    compressors: snappy,zstd,zlib

processManagement:
  timeZoneInfo: /usr/share/zoneinfo

security:
  authorization: enabled

operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 100
  slowOpSampleRate: 1.0

setParameter:
  # OpenIM uses short-lived transactions for message writes
  transactionLifetimeLimitSeconds: 60
  maxTransactionLockRequestTimeoutMillis: 5000
  # Reduce memory churn in cgroup-limited containers
  tcmallocAggressiveMemoryDecommit: 0
  # Cap index build RAM (separate from WiredTiger cache)
  maxIndexBuildMemoryUsageMegabytes: 500
  cursorTimeoutMillis: 600000
  enableLocalhostAuthBypass: false
