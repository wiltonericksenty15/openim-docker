networks:
  openim:
    external: true
    name: openim

services:
  mongo:
    image: "${MONGO_IMAGE}"
    container_name: mongo
    init: true
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - "${DATA_DIR}/data/db:/data/db"
      - "${DATA_DIR}/data/logs:/data/logs"
      - "${DATA_DIR}/config/mongod.conf:/etc/mongo/mongod.conf:ro"
      - "${DATA_DIR}/scripts:/docker-entrypoint-initdb.d:ro"
    environment:
      TZ: Asia/Shanghai
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
      MONGO_OPENIM_USERNAME: ${MONGO_USERNAME}
      MONGO_OPENIM_PASSWORD: ${MONGO_PASSWORD}
    restart: always
    shm_size: 512m
    mem_swappiness: 0
    sysctls:
      vm.max_map_count: 262144
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
      nproc:
        soft: 64000
        hard: 64000
    deploy:
      resources:
        limits:
          memory: ${MONGO_MEMORY_LIMIT}
        reservations:
          memory: 512M
    command:
      - mongod
      - --config
      - /etc/mongo/mongod.conf
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'quit(db.runCommand({ping:1}).ok ? 0 : 2)'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - openim
