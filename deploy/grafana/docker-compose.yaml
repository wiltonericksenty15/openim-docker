networks:
  openim:
    external: true
    name: openim

services:
  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: grafana
    init: true
    user: root
    restart: always
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      TZ: Asia/Shanghai
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SESSION_COOKIE_SAMESITE: none
      GF_SESSION_COOKIE_SECURE: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - "${DATA_DIR}/data:/var/lib/grafana"
    mem_swappiness: 0
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEMORY_LIMIT}
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - openim
