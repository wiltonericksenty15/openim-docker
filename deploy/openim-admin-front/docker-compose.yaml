networks:
  openim:
    external: true
    name: openim

services:
  openim-admin-front:
    image: ${OPENIM_ADMIN_FRONT_IMAGE}
    container_name: openim-admin-front
    restart: always
    ports:
      - "${OPENIM_ADMIN_FRONT_PORT}:80"
    environment:
      TZ: Asia/Shanghai
    networks:
      - openim
