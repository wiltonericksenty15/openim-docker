networks:
  openim:
    external: true
    name: openim

services:
  openim-web-front:
    image: ${OPENIM_WEB_FRONT_IMAGE}
    container_name: openim-web-front
    restart: always
    ports:
      - "${OPENIM_WEB_FRONT_PORT}:80"
    environment:
      TZ: Asia/Shanghai
    networks:
      - openim
